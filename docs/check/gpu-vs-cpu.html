<!doctype html>
<meta charset="utf-8">
<title>GPU vs CPU check</title>
<pre id="out">running…</pre>
<script type="module">
import { GPUSolver } from '../js/gpu-solver.js';
import { LBMSolver } from '../js/lbm-cpu.js';
import { voxelize, PRESETS } from '../js/shapes.js';

// Same tunnel, same body, same parameters on both solvers; compare after N steps.
const grid = { nx: 40, ny: 24, nz: 20 };
const n = grid.nx * grid.ny * grid.nz;
const params = { tau: 0.58, smagorinsky: 0.17, sponge: 6, spongeTau: 1.0, uIn: [0.08, 0, 0], ramp: 50 };
const steps = 150;

function withGround(body) {
  const s = Uint8Array.from(body.solid);
  for (let z = 0; z < grid.nz; z++) for (let x = 0; x < grid.nx; x++) s[x + grid.nx * (0 + grid.ny * z)] = 2;
  return s;
}

const cases = [
  { name: 'sphere, free air',
    body: voxelize(PRESETS.sphere, grid, { center: [13, 11.5, 9.5], length: 10 }), ground: false },
  { name: 'car, rolling road',
    body: voxelize(PRESETS.car, grid, { center: [14, 5.5, 9.5], length: 16 }), ground: true },
];

const gl = document.createElement('canvas').getContext('webgl2');
const gpu = new GPUSolver(gl, grid);
const results = [];
for (const c of cases) {
  const solid = c.ground ? withGround(c.body) : c.body.solid;
  const cpu = new LBMSolver({ ...grid, ...params, boundary: 'tunnel', solid, movingGround: c.ground });
  cpu.run(steps);

  Object.assign(gpu, { tau: params.tau, cs: params.smagorinsky, sponge: params.sponge, spongeTau: params.spongeTau,
    uIn: params.uIn, ramp: params.ramp, movingGround: c.ground });
  gpu.setSolid(solid);
  gpu.reset();
  gpu.step(steps);
  const g = gpu.readMacros();
  const force = gpu.totalForce();

  let maxU = 0, maxErr = 0, maxRhoErr = 0;
  for (let k = 0; k < n; k++) {
    if (solid[k]) continue;
    maxU = Math.max(maxU, Math.hypot(cpu.ux[k], cpu.uy[k], cpu.uz[k]));
    maxErr = Math.max(maxErr, Math.abs(g.ux[k] - cpu.ux[k]), Math.abs(g.uy[k] - cpu.uy[k]), Math.abs(g.uz[k] - cpu.uz[k]));
    maxRhoErr = Math.max(maxRhoErr, Math.abs(g.rho[k] - cpu.rho[k]));
  }
  const fmag = Math.hypot(...cpu.bodyForce);
  const fErr = Math.hypot(force[0] - cpu.bodyForce[0], force[1] - cpu.bodyForce[1], force[2] - cpu.bodyForce[2]) / fmag;
  results.push({ case: c.name, steps, maxU, relErr: maxErr / maxU, maxRhoErr, cpuForce: cpu.bodyForce, gpuForce: force,
    forceRelErr: fErr, pass: maxErr / maxU < 1e-3 && maxRhoErr < 1e-4 && fErr < 1e-3 });
}
window.result = { cases: results, pass: results.every((r) => r.pass) };
document.getElementById('out').textContent = JSON.stringify(window.result, null, 2);
</script>
